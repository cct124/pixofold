name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting, types, lint, tests and Rust
        run: pnpm check
      - name: Build desktop executable
        run: pnpm tauri build --no-bundle --ci
      - name: Verify bundled JPEG outside development environment
        run: pnpm jpeg:bundle:check
      - name: Retain bundled JPEG evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: jpeg-bundle-${{ matrix.os }}
          path: target/jpeg-bundle-*/
          if-no-files-found: ignore
          retention-days: 14

  gif-lab:
    name: GIF lossless lab (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Install pinned Rust toolchain for independent GIF validator
        run: rustup show
      - name: Build pinned single-threaded Gifsicle
        run: node tools/gif-lab.mjs build
      - name: Check generated corpus, playback and real lossless optimization
        run: node tools/gif-lab.mjs check
      - name: Build pinned JPEG helper for three-format core acceptance
        run: node tools/jpeg-lab.mjs build
      - name: Check real GIF core and PNG JPEG GIF mixed batches
        run: node tools/gif-lab.mjs core-check
      - name: Retain GIF experiment and source license evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: gif-lab-${{ matrix.os }}
          path: |
            target/gif-lab-*/
            target/gif-core-*/
          if-no-files-found: ignore
          retention-days: 14

  jpeg-lab:
    name: JPEG engine lab (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Build pinned MozJPEG tools
        run: node tools/jpeg-lab.mjs build
      - name: Check coefficients, metadata and resource boundaries
        run: node tools/jpeg-lab.mjs check
      - name: Install pinned Rust toolchain for JPEG core
        run: rustup show
      - name: Check real JPEG core and safe output
        run: node tools/jpeg-lab.mjs core-check
      - name: Retain JPEG experiment evidence and fixture notices
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: jpeg-lab-${{ matrix.os }}
          path: target/jpeg-lab-*/
          if-no-files-found: ignore
          retention-days: 14
