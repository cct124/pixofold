[workspace]
members = ["src-tauri", "crates/pixofold-core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "GPL-3.0-or-later"

[workspace.dependencies]
crc32fast = "=1.5.2"
imagequant = { version = "=4.4.1", default-features = false }
oxipng = { version = "=10.2.1", default-features = false }
png = "=0.18.1"
same-file = "=1.0.6"
sha2 = "=0.10.9"
tempfile = "=3.27.0"
pixofold-core = { path = "crates/pixofold-core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.11.6", features = [] }
tauri-build = { version = "=2.6.3", features = [] }
tauri-plugin-dialog = { version = "=2.7.3", default-features = false, features = ["gtk3"] }
ts-rs = "=12.0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"
