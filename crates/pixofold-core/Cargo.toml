[package]
name = "pixofold-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "PixoFold 独立图片处理核心"
publish = false

[dependencies]
# png已锁定同版；APNG核心显式检查zlib结束、Adler32及尾随数据。
fdeflate = "=0.3.7"
gif = { version = "=0.14.2", default-features = false, features = ["std"] }
weezl = { version = "=0.1.12", default-features = false, features = ["std"] }
crc32fast.workspace = true
imagequant.workspace = true
oxipng.workspace = true
png.workspace = true
same-file.workspace = true
sha2.workspace = true
tempfile.workspace = true
serde.workspace = true
tracing.workspace = true
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
sysinfo.workspace = true

[features]
bindings = ["dep:ts-rs"]
# 显式开发实验才开放未经验证的内存候选；单文件生产核心走独立安全提交。
gif-lossy-lab = []
apng-lossy-lab = []

[[example]]
name = "apng_lossy_lab"
required-features = ["apng-lossy-lab"]

[[example]]
name = "gif_lossy_lab"
required-features = ["gif-lossy-lab"]

[[bin]]
name = "export-bindings"
path = "src/bin/export-bindings.rs"
required-features = ["bindings"]

[lints]
workspace = true
